# ===================================================================
# Configuração do banco de dados PostgreSQL (Supabase)
# As credenciais vêm de variáveis de ambiente (SPRING_DATASOURCE_*).
# Em produção (Render), configure essas variáveis no painel:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# Localmente, se as variáveis não existirem, os valores após ":" são usados como padrão.
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.qdrzusswpsgatdwqwgtx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configurações do Hibernate / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Porta do servidor (Render injeta a variável PORT automaticamente)
# ===================================================================
server.port=${PORT:8080}